name: CI Build & Test (.NET 10 & Python)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build & Validate Solution
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET 10 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Install uv (Python Tooling)
      uses: astral-sh/setup-uv@v5

    - name: Restore NuGet Dependencies
      run: dotnet restore AutoCAD_Integration.slnx

    - name: Build Solution (Release Configuration)
      run: dotnet build AutoCAD_Integration.slnx -c Release --no-restore

    - name: Run Python MCP Server Tests
      run: uv run --directory AutoCAD.McpPython --all-extras pytest
