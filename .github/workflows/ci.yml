name: CI - Build & Test (.NET 10 & Python)

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - 'CODE_OF_CONDUCT.md'
      - 'SECURITY.md'
      - 'SUPPORT.md'
      - '.gitignore'
  pull_request:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - 'CODE_OF_CONDUCT.md'
      - 'SECURITY.md'
      - 'SUPPORT.md'
      - '.gitignore'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-test:
    name: Build & Validate Solution
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET 10 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Setup uv (Python Package Tooling)
      uses: astral-sh/setup-uv@v5

    - name: Restore NuGet dependencies
      run: dotnet restore AutoCAD_Integration.slnx

    - name: Build solution (Release configuration)
      run: dotnet build AutoCAD_Integration.slnx -c Release --no-restore

    - name: Run Python test suite (pytest)
      run: uv run --directory AutoCAD.McpPython --all-extras pytest
