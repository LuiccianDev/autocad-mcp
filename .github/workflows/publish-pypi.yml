name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Target repository'
        required: true
        default: 'pypi'
        type: choice
        options:
          - pypi
          - testpypi

jobs:
  publish:
    name: Build, Attest & Publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.target_env || 'pypi' }}
      url: ${{ (github.event.inputs.target_env == 'testpypi') && 'https://test.pypi.org/p/luiccian-autocad-mcp' || 'https://pypi.org/p/luiccian-autocad-mcp' }}
    permissions:
      id-token: write        # Mandatory for Trusted Publishing (OIDC)
      attestations: write    # Mandatory for PEP 740 Cryptographic Attestation
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Verify Package Tests & Tag Parity
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            tag_ver="${REF_NAME#v}"
            pkg_ver=$(python3 -c 'import tomllib; print(tomllib.load(open("AutoCAD.McpPython/pyproject.toml","rb"))["project"]["version"])')
            if [ "$tag_ver" != "$pkg_ver" ]; then
              echo "ERROR: tag version ($tag_ver) != pyproject.toml version ($pkg_ver)" >&2
              exit 1
            fi
          fi
          uv run --directory AutoCAD.McpPython --frozen --all-extras pytest

      - name: Build sdist and wheel
        run: uv build --directory AutoCAD.McpPython

      - name: Generate artifact attestation (PEP 740)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "AutoCAD.McpPython/dist/*"

      - name: Publish to PyPI (Production)
        if: ${{ (github.event.inputs.target_env || 'pypi') == 'pypi' }}
        run: uv publish --directory AutoCAD.McpPython

      - name: Publish to TestPyPI
        if: ${{ github.event.inputs.target_env == 'testpypi' }}
        run: uv publish --directory AutoCAD.McpPython --publish-url https://test.pypi.org/legacy/
