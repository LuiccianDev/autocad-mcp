name: Release - Build & Publish Artifacts

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (leave empty to auto-detect from pyproject.toml, e.g. v2.3.0)'
        required: false
        default: ''
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish-release:
    name: Build & Publish Release
    runs-on: windows-latest
    permissions:
      contents: write
      actions: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: ${{ github.event.inputs.tag_name || github.ref }}

    - name: Determine Release Tag and Version
      id: tag_info
      shell: pwsh
      env:
        INPUT_TAG: ${{ github.event.inputs.tag_name }}
        REF_TYPE: ${{ github.ref_type }}
        REF_NAME: ${{ github.ref_name }}
      run: |
        $tag = if ($env:INPUT_TAG) { $env:INPUT_TAG.Trim() } elseif ($env:REF_TYPE -eq "tag") { $env:REF_NAME.Trim() } else { "" }
        if (-not $tag) {
          $rawVer = (Get-Content "AutoCAD.McpPython\pyproject.toml" | Select-String 'version = "(.*?)"').Matches.Groups[1].Value
          $tag = "v$rawVer"
        }
        if ($tag -notmatch '^v\d+\.\d+\.\d+([-.][0-9A-Za-z.]+)?$') {
          throw "Invalid release tag format: '$tag'. Expected SemVer tag such as v2.5.0."
        }
        $version = $tag.TrimStart('v')
        Write-Host ">>> Resolved Release Tag: $tag"
        Write-Host ">>> Resolved Version: $version"
        "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

    - name: Verify Version Synchronization
      shell: pwsh
      env:
        RELEASE_VERSION: ${{ steps.tag_info.outputs.version }}
      run: |
        $expected = $env:RELEASE_VERSION
        $gatewayVer = ([regex]::Match((Get-Content "AutoCAD.Gateway\AutoCAD.Gateway.csproj" -Raw), '<Version>([^<]+)</Version>')).Groups[1].Value.Trim()
        $mcpVer = ([regex]::Match((Get-Content "AutoCAD.McpServer\AutoCAD.McpServer.csproj" -Raw), '<Version>([^<]+)</Version>')).Groups[1].Value.Trim()
        $pyVer = ([regex]::Match((Get-Content "AutoCAD.McpPython\pyproject.toml" -Raw), 'version\s*=\s*"([^"]+)"')).Groups[1].Value.Trim()
        $initVer = ([regex]::Match((Get-Content "AutoCAD.McpPython\src\autocad_mcp\__init__.py" -Raw), '__version__\s*=\s*"([^"]+)"')).Groups[1].Value.Trim()
        foreach ($pair in @(
          @("AutoCAD.Gateway.csproj", $gatewayVer),
          @("AutoCAD.McpServer.csproj", $mcpVer),
          @("AutoCAD.McpPython/pyproject.toml", $pyVer),
          @("AutoCAD.McpPython/src/autocad_mcp/__init__.py", $initVer)
        )) {
          if ($pair[1] -ne $expected) {
            throw "Version mismatch in $($pair[0]): found '$($pair[1])', expected '$expected'."
          }
        }
        $changelog = Get-Content "CHANGELOG.md" -Raw
        if ($changelog -notmatch ("(?m)^## \[" + [regex]::Escape($expected) + "\] - \d{4}-\d{2}-\d{2}")) {
          throw "CHANGELOG.md does not contain a dated release section for [$expected]."
        }
        Write-Host ">>> All versions and CHANGELOG entry verified for $expected"

    - name: Setup .NET 10 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Setup uv (Python Tooling)
      uses: astral-sh/setup-uv@v5

    - name: Restore and Build .NET Solution
      env:
        RELEASE_VERSION: ${{ steps.tag_info.outputs.version }}
      run: |
        dotnet restore AutoCAD_Integration.slnx
        dotnet build AutoCAD_Integration.slnx -c Release --no-restore "/p:Version=$env:RELEASE_VERSION"

    - name: Run Gateway Contract & MCP Tests
      run: |
        dotnet run --project AutoCAD.Gateway.Tests -c Release --no-build
        uv run --directory AutoCAD.McpPython --frozen --all-extras pytest

    - name: Package AutoCAD Gateway (.zip)
      run: |
        Compress-Archive -Path "AutoCAD.Gateway\bin\Release\net10.0-windows\*" -DestinationPath "AutoCAD.Gateway-Release.zip"

    - name: Package AutoCAD McpServer (.zip)
      run: |
        Compress-Archive -Path "AutoCAD.McpServer\bin\Release\net10.0\*" -DestinationPath "AutoCAD.McpServer-Release.zip"

    - name: Build Python Package (Wheel & Sdist)
      run: |
        uv build --directory AutoCAD.McpPython

    - name: Generate Release Checksums & Notes
      shell: pwsh
      env:
        RELEASE_VERSION: ${{ steps.tag_info.outputs.version }}
        RELEASE_TAG: ${{ steps.tag_info.outputs.tag }}
      run: |
        $artifacts = @(Get-Item "AutoCAD.Gateway-Release.zip","AutoCAD.McpServer-Release.zip","AutoCAD.McpPython\dist\*")
        $lines = foreach ($item in $artifacts) {
          $hash = (Get-FileHash -Path $item.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($item.Name)"
        }
        $lines | Set-Content -Path "SHA256SUMS.txt" -Encoding utf8
        .\scripts\generate-release-notes.ps1 -Version "$env:RELEASE_VERSION" -Tag "$env:RELEASE_TAG" -OutputPath "release_body.md"

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.tag_info.outputs.tag }}
        name: Release ${{ steps.tag_info.outputs.tag }}
        body_path: release_body.md
        files: |
          AutoCAD.Gateway-Release.zip
          AutoCAD.McpServer-Release.zip
          AutoCAD.McpPython/dist/*.whl
          AutoCAD.McpPython/dist/*.tar.gz
          SHA256SUMS.txt
        generate_release_notes: true
        make_latest: true

    - name: Trigger PyPI Publication Workflow
      shell: pwsh
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_TAG: ${{ steps.tag_info.outputs.tag }}
      run: |
        Write-Host ">>> Triggering chained PyPI publication workflow for $env:RELEASE_TAG..."
        gh workflow run publish-pypi.yml --ref "$env:RELEASE_TAG" -f target_env=pypi
