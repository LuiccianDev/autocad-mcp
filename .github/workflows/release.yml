name: Release - Build & Publish Artifacts

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (leave empty to auto-detect from pyproject.toml, e.g. v2.3.0)'
        required: false
        default: ''
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish-release:
    name: Build & Publish Release
    runs-on: windows-latest
    permissions:
      contents: write
      actions: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Determine Release Tag and Version
      id: tag_info
      shell: pwsh
      run: |
        $tag = "${{ github.event.inputs.tag_name }}"
        if (-not $tag) {
          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
          } else {
            $rawVer = (Get-Content "AutoCAD.McpPython\pyproject.toml" | Select-String 'version = "(.*?)"').Matches.Groups[1].Value
            $tag = "v$rawVer"
          }
        }
        $version = $tag.TrimStart('v')
        Write-Host ">>> Resolved Release Tag: $tag"
        Write-Host ">>> Resolved Version: $version"
        Write-Output "tag=$tag" >> $env:GITHUB_OUTPUT
        Write-Output "version=$version" >> $env:GITHUB_OUTPUT

    - name: Setup .NET 10 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Setup uv (Python Tooling)
      uses: astral-sh/setup-uv@v5

    - name: Restore and Build .NET Solution
      run: |
        dotnet restore AutoCAD_Integration.slnx
        dotnet build AutoCAD_Integration.slnx -c Release --no-restore /p:Version=${{ steps.tag_info.outputs.version }}

    - name: Package AutoCAD Gateway (.zip)
      run: |
        Compress-Archive -Path "AutoCAD.Gateway\bin\Release\net10.0-windows\*" -DestinationPath "AutoCAD.Gateway-Release.zip"

    - name: Package AutoCAD McpServer (.zip)
      run: |
        Compress-Archive -Path "AutoCAD.McpServer\bin\Release\net10.0\*" -DestinationPath "AutoCAD.McpServer-Release.zip"

    - name: Build Python Package (Wheel & Sdist)
      run: |
        uv build --directory AutoCAD.McpPython

    - name: Generate Release Body
      shell: pwsh
      run: |
        $ver = "${{ steps.tag_info.outputs.version }}"
        $tag = "${{ steps.tag_info.outputs.tag }}"
        $body = @"
# AutoCAD 2027 & Civil 3D AI Gateway and MCP Server — Version $ver

Automated release $tag for the AutoCAD AI Gateway and MCP Server ecosystem.

## Artifacts Included
- AutoCAD.Gateway-Release.zip: Native .NET 10 AutoCAD extension plugin (acad.exe NETLOAD).
- AutoCAD.McpServer-Release.zip: Standalone C# .NET 10 MCP server (STDIO).
- Python Distributions: Python FastMCP wheel and sdist packages.

## Highlights
- 45 typed MCP tools covering inspection, geometry, layers, calculations, layouts, and Civil 3D.
- High-performance batch drafting engine (dibujar_geometria_lote).
- Thread-safe command dispatching with Application.Idle synchronization.
- Zero-secret security with X-Gateway-Token authentication.
"@
        Set-Content -Path "release_body.md" -Value $body

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.tag_info.outputs.tag }}
        name: Release ${{ steps.tag_info.outputs.tag }}
        body_path: release_body.md
        files: |
          AutoCAD.Gateway-Release.zip
          AutoCAD.McpServer-Release.zip
          AutoCAD.McpPython/dist/*.whl
          AutoCAD.McpPython/dist/*.tar.gz
        generate_release_notes: true
        make_latest: true

    - name: Trigger PyPI Publication Workflow
      shell: pwsh
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        Write-Host ">>> Triggering chained PyPI publication workflow..."
        gh workflow run publish-pypi.yml --ref master -f target_env=pypi
